; PiQuill ESP32 firmware. Untested scaffold.
;
; Board: Unexpected Maker FeatherS3 family. The official PlatformIO platform
; only has the old Arduino-ESP32 2.x core, so this uses the pioarduino platform
; (Arduino core 3.x), as Unexpected Maker's getting-started guide recommends.
[env:um_feathers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = um_feathers3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; The board has no USB-UART chip, so serial goes over the S3's native USB.
; Without these two flags there is no serial port after the sketch starts.
; Note: once the USB port is used as a keyboard host these will have to go, and
; debug output will need UART0 (GPIO43/44) instead.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; The CDC port is not always present, so do not wait for it when uploading.
board_upload.wait_for_upload_port = false
