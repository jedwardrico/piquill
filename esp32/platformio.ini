; PiQuill ESP32 firmware. Untested scaffold.
;
; Board: Unexpected Maker FeatherS3[D]. The official PlatformIO platform only has
; the old Arduino-ESP32 2.x core, so this uses the pioarduino platform (Arduino
; core 3.x), as Unexpected Maker's getting-started guide recommends.
;
; Two programs share the sources:
;   pio run -e display_test -t upload   draws a test pattern (no BLE library needed)
;   pio run -e typing -t upload         BLE keyboard -> text on the e-paper
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = um_feathers3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 16 MB flash: use the 16 MB partition table (large app + a big LittleFS area).
board_build.partitions = default_16MB.csv
; The board has no USB-UART chip, so serial goes over the S3's native USB.
; Without these two flags there is no serial port after the sketch starts.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; The CDC port is not always present, so do not wait for it when uploading.
board_upload.wait_for_upload_port = false

[env:display_test]
build_src_filter = +<*> -<app_typing.cpp> -<ble_keyboard.cpp>

[env:typing]
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_src_filter = +<*> -<main.cpp>
