<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1200" height="780" fill="#ffffff"/>
<style>
.box{fill:#f4f6f8;stroke:#33414d;stroke-width:2}
.feather{fill:#e8f0fa;stroke:#1f4f99;stroke-width:2.5}
.t{fill:#1b252d} .h{font-size:16px;font-weight:bold;fill:#1b252d}
.s{font-size:11px;fill:#56636d}
.w{fill:none;stroke-width:2.5;stroke-linejoin:round}
.spi{stroke:#1f6fd1} .pwr{stroke:#d1322a} .gnd{stroke:#222} .ctl{stroke:#e08a00}
.dot{fill:#1b252d} .part{fill:#fff;stroke:#33414d;stroke-width:2}
</style>
<text x="20" y="32" class="h" style="font-size:19px" text-anchor="start">PiQuill FeatherS3 wiring: Power button only (keyboard over BLE, no keyboard wiring)</text>
<text x="20" y="52" class="s" text-anchor="start">All grounds common to Feather GND. Draft, untested. GPIO5 is a placeholder: use any free RTC GPIO (0-21) that is on the header and not strapping/USB. Check battery polarity first.</text>
<g transform="translate(900,90)"><text x="0" y="0" class="h" text-anchor="start">Legend</text>
<line class="w spi" x1="0" y1="18" x2="36" y2="18"/><text x="46" y="22" class="t" text-anchor="start">Display signals</text>
<line class="w pwr" x1="0" y1="40" x2="36" y2="40"/><text x="46" y="44" class="t" text-anchor="start">Power (+)</text>
<line class="w gnd" x1="0" y1="62" x2="36" y2="62"/><text x="46" y="66" class="t" text-anchor="start">Ground (common)</text>
<line class="w ctl" x1="0" y1="84" x2="36" y2="84"/><text x="46" y="88" class="t" text-anchor="start">Button / control</text>
</g>
<rect class="box" x="40" y="100" width="200" height="330" rx="8"/><text x="140" y="124" class="h" text-anchor="middle">DESPI-C02 panel</text>
<text x="50" y="164" class="t" text-anchor="start">SCK</text>
<polyline class="w spi" points="240,160 420,160"/>
<text x="330" y="154" class="s" text-anchor="middle">GPIO36</text>
<text x="430" y="164" class="t" text-anchor="start">SCK</text>
<text x="50" y="200" class="t" text-anchor="start">SDI</text>
<polyline class="w spi" points="240,196 420,196"/>
<text x="330" y="190" class="s" text-anchor="middle">GPIO35</text>
<text x="430" y="200" class="t" text-anchor="start">MO</text>
<text x="50" y="236" class="t" text-anchor="start">CS</text>
<polyline class="w spi" points="240,232 420,232"/>
<text x="330" y="226" class="s" text-anchor="middle">GPIO1</text>
<text x="430" y="236" class="t" text-anchor="start">1</text>
<text x="50" y="272" class="t" text-anchor="start">D/C</text>
<polyline class="w spi" points="240,268 420,268"/>
<text x="330" y="262" class="s" text-anchor="middle">GPIO7</text>
<text x="430" y="272" class="t" text-anchor="start">7</text>
<text x="50" y="308" class="t" text-anchor="start">RES</text>
<polyline class="w spi" points="240,304 420,304"/>
<text x="330" y="298" class="s" text-anchor="middle">GPIO10</text>
<text x="430" y="308" class="t" text-anchor="start">10</text>
<text x="50" y="344" class="t" text-anchor="start">BUSY</text>
<polyline class="w spi" points="240,340 420,340"/>
<text x="330" y="334" class="s" text-anchor="middle">GPIO11</text>
<text x="430" y="344" class="t" text-anchor="start">11</text>
<text x="50" y="380" class="t" text-anchor="start">GND</text>
<polyline class="w gnd" points="240,376 420,376"/>
<text x="330" y="370" class="s" text-anchor="middle">GND</text>
<text x="430" y="380" class="t" text-anchor="start">GND</text>
<text x="50" y="416" class="t" text-anchor="start">3.3V</text>
<polyline class="w pwr" points="240,412 420,412"/>
<text x="330" y="406" class="s" text-anchor="middle">3V3</text>
<text x="430" y="416" class="t" text-anchor="start">3V3</text>
<rect class="feather" x="420" y="100" width="220" height="460" rx="10"/><text x="530" y="124" class="h" text-anchor="middle">FeatherS3</text>
<text x="530" y="520" class="s" text-anchor="middle">USB-C free: flash / serial / charge</text>
<text x="630" y="154" class="t" text-anchor="end">3V3</text>
<text x="630" y="194" class="t" text-anchor="end">GPIO5 (button)</text>
<polyline class="w pwr" points="640,150 760,150 760,152"/>
<rect class="part" x="751" y="152.0" width="18" height="36"/><text x="776" y="174.0" class="t" text-anchor="start">10k pull-up</text>
<polyline class="w ctl" points="640,190 960,190"/>
<circle class="dot" cx="760" cy="190" r="4"/>
<polyline class="w ctl" points="860,190 860,230"/>
<circle class="dot" cx="860" cy="190" r="4"/>
<circle class="part" cx="860" cy="238" r="4"/><line class="w gnd" x1="860" y1="238" x2="878" y2="262"/><circle class="part" cx="860" cy="274" r="4"/>
<text x="845" y="246" class="t" text-anchor="end">Power button</text>
<text x="845" y="262" class="s" text-anchor="end">(momentary, to GND)</text>
<polyline class="w gnd" points="860,278 860,296"/>
<line class="w gnd" x1="860" y1="296" x2="860" y2="304"/><line class="w gnd" x1="846" y1="304" x2="874" y2="304"/><line class="w gnd" x1="851" y1="310" x2="869" y2="310"/><line class="w gnd" x1="856" y1="316" x2="864" y2="316"/>
<polyline class="w ctl" points="960,190 960,226"/>
<circle class="dot" cx="960" cy="190" r="4"/>
<line class="w gnd" x1="946" y1="226" x2="974" y2="226"/><line class="w gnd" x1="946" y1="234" x2="974" y2="234"/>
<text x="985" y="232" class="t" text-anchor="start">100 nF debounce</text>
<polyline class="w gnd" points="960,234 960,296"/>
<line class="w gnd" x1="960" y1="296" x2="960" y2="304"/><line class="w gnd" x1="946" y1="304" x2="974" y2="304"/><line class="w gnd" x1="951" y1="310" x2="969" y2="310"/><line class="w gnd" x1="956" y1="316" x2="964" y2="316"/>
<rect class="box" x="400" y="650" width="260" height="90" rx="8"/><text x="530" y="676" class="h" text-anchor="middle">3.7 V LiPo, 3000 mAh</text>
<text x="530" y="696" class="s" text-anchor="middle">with protection circuit; JST PH</text>
<text x="530" y="712" class="s" text-anchor="middle">CHECK POLARITY vs board +/- marking</text>
<polyline class="w pwr" points="490,650 490,560"/>
<text x="498" y="610" class="s" text-anchor="start">+ (JST)</text>
<polyline class="w gnd" points="570,650 570,560"/>
<text x="578" y="610" class="s" text-anchor="start">- (JST)</text>
<text x="530" y="552" class="s" text-anchor="middle">JST PH battery connector</text>
<rect class="box" x="760" y="420" width="300" height="110" rx="8"/><text x="910.0" y="450" class="h" text-anchor="middle">Keychron B1 Pro</text>
<text x="910.0" y="472" class="s" text-anchor="middle">Own battery fitted, no wires to</text>
<text x="910.0" y="488" class="s" text-anchor="middle">the Feather. Pairs over BLE</text>
<text x="910.0" y="504" class="s" text-anchor="middle">(wireless).</text>
<text x="910.0" y="524" class="s" text-anchor="middle">Sleep/wake of keyboard: its own.</text>
<text x="20" y="768" class="s" text-anchor="start">Deep sleep: button wakes via ext0 (active low). Long press (about 2 s) = power down. Keyboard keeps its own battery and power switch.</text>
</svg>
